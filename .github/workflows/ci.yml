name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install blake3 coverage
      - name: Unit tests
        run: |
          cargo test --workspace
          python -m unittest discover -s tests/unit -v
      - name: C++ semantic tests
        run: |
          cmake -S third_party/lupine -B build-lupine -DLUPINE_BUILD_CUDA=OFF -DLUPINE_BUILD_NVML=OFF -DLUPINE_BUILD_HIP=OFF -DLUPINE_BUILD_SERVER=OFF -DOLGP_PATCHES=ON
          cmake --build build-lupine --parallel 4
          ctest --test-dir build-lupine --output-on-failure -R olgp_semantic_test
      - name: Contract and patch checks
        run: |
          scripts/check-contract.sh
          scripts/check-lupine-patches.sh
      - name: 95% coverage gate
        run: scripts/check-coverage.sh
