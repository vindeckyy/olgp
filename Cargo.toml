[workspace]
resolver = "2"
members = [
    "crates/olgp-control",
    "crates/olgp-node",
    "crates/olgp-cli",
    "crates/olgp-driver",
    "crates/olgp-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/olgp/olgp"
authors = ["OLGP contributors"]

[workspace.dependencies]
snow = { version = "0.10", features = ["risky-raw-split"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
ed25519-dalek = "3"
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
aead = "0.6"
chacha20poly1305 = "0.11"
rand = "0.10"
spake2 = "0.4"
thiserror = "2"
mdns-sd = "0.21"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
